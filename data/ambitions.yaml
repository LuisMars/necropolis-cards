# Minor Ambitions — WIP Necropolis Rules 0.9, p.67-68.
# The leader's long-term campaign goals. Before each battle a player
# picks 4 minor ambitions to pursue; each has a Condition, a goal number
# (how many times the condition must be met) and a Reward. Rendered via
# the dedicated ambition.svg template: separate CONDITION and REWARD
# body blocks, plus check-off tracker dots driven by the `goal:` field
# (ambition.svg's TRACKER marker).
# Spanish (_es) fields are the official text transcribed from
# "Necropolis español v1_1.pdf" p.67-68 (not machine-translated).

- category: MINOR AMBITION
  category_es: AMBICIÓN MENOR
  name: Test the Limits of Undeath
  name_es: Probar los Límites del Más Allá
  restrictions: Curse Path
  restrictions_es: Sendero de la Maldición
  sigil: ""
  goal: 4
  condition: Cast the summon spell.
  condition_es: Lanzar el hechizo Invocar.
  reward: Gain +1 max HP for the whole gathering.
  reward_es: +1 HP máximo para todo el Séquito.

- category: MINOR AMBITION
  category_es: AMBICIÓN MENOR
  name: Commune with the Truth
  name_es: Comulgar con la Verdad
  restrictions: Curse Path
  restrictions_es: Sendero de la Maldición
  sigil: ""
  goal: 2
  condition: Run out of mana dice during a battle.
  condition_es: Quedarse sin dados de maná durante una partida.
  reward: +1 mana point of any type.
  reward_es: +1 punto de maná de cualquier tipo.

- category: MINOR AMBITION
