  condition: Cause an enemy model to become Shattered with a spell.
  condition_es: Causar que una miniatura enemiga sea Hecha añicos con un hechizo.
  reward: +1 to the channelling roll for a spell of your choice.
  reward_es: +1 a la tirada de canalización para un hechizo de tu elección.

