# Basic Leader Traits — rulebook v0.9 p.30 (10 entries, I–X).
# Every leader chooses 1 Basic Leader Trait at warband creation.

- category: BASIC LEADER TRAIT
  category_es: RASGO BÁSICO DE LÍDER
  name: Unyielding Will
  name_es: Voluntad Inquebrantable
  app_id: tb0
  requires: { keywords: [Leader] }
  modifiers: { hp: 2 }
  restrictions: Leader
  restrictions_es: Líder
  sigil: ""
  effect: |
    Gain +2 max HP.
  effect_es: |
    Gana +2 de HP máximo.

