# Minor Treasures — rulebook v0.9 p.66.
# Roll on this table after each scenario / completing 5 minor ambitions.
# Leaders may carry up to 3; minions 2; Beast-keyword minions none.
# All 10 obols each. Treated as Equipment (single-use, discarded).

- name: Binding Pact
  name_es: Pacto Vinculante
  category: MINOR TREASURE
  category_es: TESORO MENOR
  cost: 10 obols
  cost_es: 10 óbolos
  armour: "—"
  flavor: A coiled scrap of contract, signed in your dust.
  flavor_es: Un retazo de contrato enrollado, firmado con tu polvo.
  effect: |
    Discard at the deployment step and add an additional Small Beast of any type to your gathering for the duration of the battle.
  effect_es: |
    Descártalo en la fase de despliegue para añadir una Bestia Pequeña adicional de cualquier tipo a tu Séquito durante la batalla.

