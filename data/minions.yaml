- name: Large Beast
  name_es: Bestia Grande
  type_keyword: Beast
  type_keyword_es: Bestia
  keyword: Blood/Bone
  keyword_es: Sangre/Hueso
  cost: 80 obols
  cost_es: 80 óbolos
  base: 40–60 mm
  stats: { AP: 2, M: 3, VIOL: 7+, RNGD: "—", HP: 15 }
  flavor: A patchwork beast, a tide of six dozen skulls.
  flavor_es: Una bestia hecha de retazos, una marea de seis docenas de calaveras.
