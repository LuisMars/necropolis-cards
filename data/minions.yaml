- name: Gigantic Horror
  name_es: Horror Colosal
  type_keyword: Colossal                     # rulebook p.35 (app adds Husk)
  type_keyword_es: Colosal
  keyword: Blood/Bone/Plasm
  keyword_es: Sangre/Hueso/Plasma
  cost: 190 obols
  cost_es: 190 óbolos
  base: 50–60 mm
  stats: { AP: 3, M: 3, VIOL: 7+, RNGD: 7+, HP: 25 }
  flavor: A rotten chimeric horror, the skeleton of a giant knight, a screaming mass of souls.
  flavor_es: Un horror quimérico podrido, el esqueleto de un caballero gigante, una masa gritona de almas.
  special_rules: |
    Colossal: may only take weapons from the Colossal Melee Weapon list.

    Unique. Each gathering may take only 1 Gigantic Horror.

    Threatening Aura: may take the Lurk action for 0 AP cost once per turn.

    Plasm Warrior: gains Fly, -2 HP, cannot wear heavy armour.
  special_rules_es: |
    Colosal: solo puede coger armas de la lista de Armas Colosales cuerpo a cuerpo.

    Único. Cada Séquito solo puede llevar 1 Horror Colosal.

    Aura Amenazante: puede realizar la acción Acechar sin gastar PA una vez por turno.

    Guerrero de Plasma: gana Vuelo, -2 HP, no puede llevar armadura pesada.
