# Dread Omens — WIP Necropolis Rules 0.9, p.60-61.
# Optional battlefield-wide effects both players may agree to roll for
# before a scenario. Each effect field leads with the rulebook flavour,
# then the mechanical rule (rendered via rule.svg's EFFECT block).

- category: DREAD OMEN
  category_es: AUGURIO SINIESTRO
  name: Magical Storm
  name_es: Tormenta Mágica
  restrictions: Omen I
  restrictions_es: Augurio I
  sigil: ""
  effect: |
    The battlefield is whipped by a terrifying gale bringing swirling debris and ensorcelled thunder to bear on the gatherings as they try to take cover.

    Any model that is not in base contact with a terrain feature (such as a wall or vertical structure) at the end of their activation suffers 2 damage.
  effect_es: |
    El campo de batalla es azotado por un viento terrorífico que arrastra escombros y trae consigo truenos encantados que caen sobre los Séquitos mientras estos intentan ponerse a cubierto.

    Cualquier miniatura que no esté en contacto con un elemento de terreno (como un muro o una estructura vertical) al final de su activación sufre 2 puntos de daño.

- category: DREAD OMEN
  category_es: AUGURIO SINIESTRO
  name: Sorcerous Duel Site
  name_es: Lugar del Duelo de Hechiceros
  restrictions: Omen II
  restrictions_es: Augurio II
  sigil: ""
  effect: |
    This place was once the site of a sorcerous battle of immense power, and mana still crackles in the air.

    Each leader receives an additional mana dice of any kind at the start of the battle. In addition, arcane backlash occurs on a roll of 1-2 for the duration of the battle.
  effect_es: |
    Este lugar fue antaño el escenario de una batalla de hechiceros de inmenso poder, y el maná aún restalla en el aire.

    Cada líder recibe un dado de maná adicional de cualquier tipo al inicio de la batalla. Además, el Revés Arcano se produce con una tirada de 1-2 durante toda la partida.

- category: DREAD OMEN
  category_es: AUGURIO SINIESTRO
  name: Masterless Beasts
  name_es: Bestias sin Amo
  restrictions: Omen III
  restrictions_es: Augurio III
  sigil: ""
  effect: |
    Rotting monstrosities long separated from their master stalk this area.

    After players have deployed, each player may set up a large beast (NPC) of any type, armed with large claws, within 3" of the board centre.
  effect_es: |
    Monstruosidades putrefactas separadas hace tiempo de su amo merodean por la zona.

    Después de que los jugadores se hayan desplegado, cada jugador puede colocar una bestia grande (PNJ) de cualquier tipo, armada con garras grandes, en un radio de hasta 3" del centro del tablero.

- category: DREAD OMEN
  category_es: AUGURIO SINIESTRO
  name: Swampy Mire
  name_es: Lodazal Pantanoso
  restrictions: Omen IV
  restrictions_es: Augurio IV
  sigil: ""
  effect: |
    The ground here is sodden, and those who do not struggle onwards are swallowed whole in the marshy ground.

    Any model that does not make a move action during its activation suffers 2 damage as it sinks into the ground.
  effect_es: |
    Aquí el suelo está empapado y los que no luchan por avanzar son tragados por el terreno cenagoso.

    Cualquier miniatura que no realice una acción de movimiento durante su activación sufre 2 puntos de daño mientras se hunde en el suelo.

- category: DREAD OMEN
  category_es: AUGURIO SINIESTRO
  name: Rising Murk
  name_es: Niebla Ascendente
  restrictions: Omen V
  restrictions_es: Augurio V
  sigil: ""
  effect: |
    Dark mist rises from the earth, quickly blinding the gatherings.

    From the beginning of turn 3, all ranged weapons have a maximum range of 6".
  effect_es: |
    Una niebla oscura se eleva desde la tierra cegando rápidamente a los Séquitos.

    A partir del inicio del turno 3, todas las armas a distancia tienen alcance máximo de 6".

- category: DREAD OMEN
  category_es: AUGURIO SINIESTRO
  name: Dust-Rot
  name_es: Polvo de Podredumbre
  restrictions: Omen VI
  restrictions_es: Augurio VI
  sigil: ""
  effect: |
    Ancient rot hangs in the air, eroding all from existence.

    If a model is below their maximum HP at the end of their activation, that model suffers 1 damage.
  effect_es: |
    Una podredumbre ancestral flota en el aire erosionando todo hasta hacerlo desaparecer.

    Si una miniatura está por debajo de sus HP máximos al final de su activación, sufre 1 punto de daño.

- category: DREAD OMEN
  category_es: AUGURIO SINIESTRO
  name: Soul Trap
  name_es: Trampa de Almas
  restrictions: Omen VII
  restrictions_es: Augurio VII
  sigil: ""
  effect: |
    No respite from existence can be found here; the defeated are quickly reformed against their will by unknown powers.

    In the initiative step of each turn, each player may choose one of their Shattered models and place it back on the board within 3" of their leader, restoring 4 HP to it.
  effect_es: |
    Aquí no se encuentra respiro de la existencia; los derrotados son rápidamente reformados contra su voluntad por poderes desconocidos.

    En el paso de iniciativa de cada turno, cada jugador puede elegir una de sus miniaturas Hechas añicos y volver a colocarla en el tablero en un radio de hasta 3" de su líder, restaurándole 4 HP.

- category: DREAD OMEN
  category_es: AUGURIO SINIESTRO
  name: Scattered Treasures
  name_es: Tesoros Dispersos
  restrictions: Omen VIII
  restrictions_es: Augurio VIII
  sigil: ""
  effect: |
    Forgotten coins, discarded in the darkness.

    Alternate placing 2 relic tokens per player. Relics must be 2" apart and as close to the centre of the board as possible. Players receive 1d10 obols for each relic token carried by their gathering at the end of the scenario.
  effect_es: |
    Monedas olvidadas que brillan en la oscuridad.

    Alternad colocando 2 marcadores de reliquia por jugador. Las reliquias deben estar separadas por 2" entre sí y lo más cerca posible del centro del tablero. Los jugadores reciben 1D10 óbolos por cada marcador de reliquia que lleve su Séquito al final del escenario.

- category: DREAD OMEN
  category_es: AUGURIO SINIESTRO
  name: Lost Peddler
  name_es: Mercader Perdido
  restrictions: Omen IX
  restrictions_es: Augurio IX
  sigil: ""
  effect: |
    Caught in the darkness of the battlefield is a peddler, who calls out to all to come and see their wares, heedless of the danger all around.

    After players have deployed, set up a Peddler (NPC) of any type within 3" of the board centre. This NPC activates in the Others Phase as normal but may only take move actions of 3" and may not attack, be attacked, or be the target of any spells.
  effect_es: |
    Atrapado en la oscuridad del campo de batalla hay un mercader que grita a todos para que vengan a ver sus mercancías sin importarle el peligro que le rodea.

    Después de que los jugadores se hayan desplegado, coloca un Mercader (PNJ) de cualquier tipo en un radio de hasta 3" del centro del tablero. Este PNJ se activa en la Fase de Otros como es habitual, pero solo puede realizar acciones de movimiento de 3" y no puede atacar, ser atacado ni ser objetivo de ningún hechizo.
