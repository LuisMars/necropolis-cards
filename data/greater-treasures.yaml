# Greater Treasures — rulebook v0.9 p.69-70.
# Roll 2d10 and choose the preferred result. Awarded for every 5 completed
# ambitions. Leaders may carry up to 2 greater treasures; minions 1; Beast-
# keyword minions none.

- name: Sigils of Abnegation
  name_es: Sigilos de Abnegación
  category: GREATER TREASURE
  category_es: TESORO MAYOR
  cost: —
  armour: "—"
  flavor: Burn the ancient sigils into the air. Destroy the weak in a shower of cinders.
  flavor_es: Quema antiguos sigilos en el aire. Destruye a los débiles en una lluvia de cenizas.
  effect: |
    Once per scenario, the model's melee weapon may be replaced with the following profile for one attack action:

    Range 2 · Attacks 4 · Damage 2/4. May push 2" on glance and 4" on hit.
  effect_es: |
    Una vez por escenario, el arma cuerpo a cuerpo de la miniatura puede reemplazarse por el siguiente perfil para una acción de ataque:

    Alcance 2 · Ataques 4 · Daño 2/4. Puede empujar 2" al fallar y 4" al acertar.

- name: Cinder-Ash Bolts
  name_es: Virotes de Ceniza y Pavesas
  category: GREATER TREASURE
  category_es: TESORO MAYOR
  cost: —
  armour: "—"
  flavor: Black iron missiles inscribed with the lost sorcery of embers.
  flavor_es: Misiles de hierro negro con inscripciones de la magia perdida de las brasas.
  effect: |
    Once per scenario, after this model resolves a ranged attack you may make the following ranged attack against all other models within 3" of the target:

    Range (as weapon) · Attacks 1 · Damage 1/4.
  effect_es: |
    Una vez por escenario, después de que esta miniatura resuelva un ataque a distancia, puedes realizar el siguiente ataque a distancia contra todas las demás miniaturas en un radio de hasta 3" del objetivo:

    Alcance (el del arma) · Ataques 1 · Daño 1/4.

- name: The Crow's Beak
  name_es: El Pico del Cuervo
  category: GREATER TREASURE
  category_es: TESORO MAYOR
  cost: —
  armour: "—"
  flavor: Many have carried this warpick into battle; all see glory while their goals align with the weapon's own.
  flavor_es: Muchos han llevado esta pica de guerra a la batalla; todos alcanzan la gloria mientras sus objetivos coinciden con los de la propia arma.
  effect: |
    One model may replace its weapon with The Crow's Beak (cannot replace it again afterwards).

    Range 1 · Attacks 3 · Damage 1/3. Ignores 4 armour.
  effect_es: |
    Una miniatura puede sustituir su arma por El Pico del Cuervo, pero no podrá volver a sustituir su arma a partir de ese momento.

    Alcance 1 · Ataques 3 · Daño 1/3. Ignora 4 puntos de armadura.

- name: Azure Sigil Brand
  name_es: Marca de Sigilo Azur
  category: GREATER TREASURE
  category_es: TESORO MAYOR
  cost: —
  armour: "—"
  flavor: A glowing brand seared into the surface of a weapon, moving like quicksilver in the presence of a rival power.
  flavor_es: Una marca resplandeciente grabada a fuego en la superficie de un arma, que se mueve como el mercurio en presencia de un poder rival.
  effect: |
    If this model makes a melee attack action against a model with the Leader keyword, it gains an additional attack for this action.
  effect_es: |
    Si esta miniatura realiza una acción de ataque cuerpo a cuerpo contra una miniatura con la palabra clave Líder, gana un ataque adicional para esta acción.

- name: Etherfall Talisman
  name_es: Talismán de Caída Etérea
  category: GREATER TREASURE
  category_es: TESORO MAYOR
  cost: —
  armour: "—"
  flavor: A weightless metal ring hung from a belt loop.
  flavor_es: Un anillo metálico ligero que cuelga de una presilla del cinturón.
  effect: |
    If this model falls for any reason it will only suffer a maximum of 2 damage.
  effect_es: |
    Si esta miniatura cae por cualquier razón, solo sufrirá un máximo de 2 puntos de daño.

- name: Pyrite Mail
  name_es: Cota de Oro Falso
  category: GREATER TREASURE
  category_es: TESORO MAYOR
  cost: —
  armour: 1
  flavor: False gold spun into armour infused with ancient magics of structure.
  flavor_es: Oro falso convertido en una armadura impregnada de antiguas magias estructurales.
  effect: |
    One model may replace their armour with Pyrite Mail. Armour 1.

    When an attack action is fully resolved against the wearer they may push their attacker 1", if they are not Shattered.
  effect_es: |
    La miniatura puede reemplazar su armadura con la Cota de Oro Falso. Armadura 1.

    Cuando se resuelve una acción de ataque contra el portador, este puede empujar a su atacante 1" si no ha sido Hecho añicos.

- name: Ever-blinking Eye
  name_es: Ojo del Parpadeo Perpetuo
  category: GREATER TREASURE
  category_es: TESORO MAYOR
  cost: —
  armour: "—"
  flavor: A frigid lump of lapis lazuli inscribed with the cold eyes of stars. All is one.
  flavor_es: Un frío trozo de lapislázuli grabado con los fríos ojos de las estrellas. Todo es uno.
  effect: |
    Once per scenario, at the end of the model's activation it may swap places with another friendly model.
  effect_es: |
    Una vez por escenario, al final de la activación de la miniatura, podrá intercambiar su lugar con otra miniatura aliada.

- name: Worming Circlet
  name_es: Aro Serpenteante
  category: GREATER TREASURE
  category_es: TESORO MAYOR
  cost: —
  armour: "—"
  flavor: A dark circlet woven from the husks of curse-worms — it twists and moves when worn.
  flavor_es: Una diadema oscura tejida con las cáscaras de gusanos malditos; se retuerce y se mueve cuando se lleva puesta.
  effect: |
    Each scenario, choose one spell an opponent's leader knows. Your leader also knows this spell for the duration of the scenario.
  effect_es: |
    Una vez por escenario, elige un hechizo que conozca el líder de un oponente. Tu líder también conoce este hechizo durante este escenario.

- name: Doomrot Branch
  name_es: Rama de Podredumbre Fatídica
  category: GREATER TREASURE
  category_es: TESORO MAYOR
  cost: —
  armour: "—"
  flavor: A hex-sealed branch from the depths of Doomrot.
  flavor_es: Una rama sellada con un hechizo procedente de las profundidades de Ramaaldita.
  effect: |
    Once per scenario, at the beginning of the model's activation you may swap the type (Blood/Bone/Plasm) of 1 mana dice in the gathering's mana pool to any other type. Does not count as picking up mana for other rules.
  effect_es: |
    Una vez por escenario, al inicio de la activación de la miniatura, puedes cambiar el tipo (Sangre/Hueso/Plasma) de 1 dado de maná en la reserva de maná del Séquito a cualquier otro tipo. Esto no cuenta como recoger maná a efectos de otras reglas.

- name: Embracing Diapason
  name_es: Diapasón Acaparador
  category: GREATER TREASURE
  category_es: TESORO MAYOR
  cost: —
  armour: "—"
  flavor: The resonant notes of this silver diapason draw magical power toward the bearer.
  flavor_es: Las notas resonantes de este diapasón de plata atraen poderes mágicos hacia quien lo lleva.
  effect: |
    Once per scenario, during its activation, this model may collect all mana tokens within 6" as if they had moved over them.
  effect_es: |
    Una vez por escenario, durante su activación, esta miniatura puede recolectar todas las fichas de maná en un radio de hasta 6" como si se hubiera movido sobre ellas.
