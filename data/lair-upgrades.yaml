# Lair Upgrades — rulebook v0.9 p.71 ("Wayfinders, Pack Beasts and Seers").
# Bought during a campaign for 50 obols each; each upgrade can only be
# purchased once. Rendered with equipment.svg for the cost + flavour + effect
# layout. Dank Culvert and Abandoned Mine (and Dusty Crypts / Bell Tower)
# share the same effect in the rulebook — kept as printed.

- name: Arcane Library
  name_es: Biblioteca Arcana
  category: LAIR UPGRADE
  category_es: MEJORA DE GUARIDA
  cost: 50 obols
  cost_es: 50 óbolos
  armour: "—"
  flavor: Musty grimoires stacked high in piles; occult knowledge from ages past.
  flavor_es: Grimorios mohosos apilados en altos montones; saber oculto de eras pasadas.
  effect: |
    Gain 1 spell of any type.
  effect_es: |
    Gana 1 hechizo de cualquier tipo.

- name: Balefire Brazier
  name_es: Brasero de Fuego Fúnebre
  category: LAIR UPGRADE
  category_es: MEJORA DE GUARIDA
  cost: 50 obols
  cost_es: 50 óbolos
  armour: "—"
  flavor: A channelling brazier burning with darkling flame.
  flavor_es: Un brasero canalizador que arde con una llama sombría.
  effect: |
    Gain 1 mana point of any type.
  effect_es: |
    Gana 1 punto de maná de cualquier tipo.

- name: Forgotten Forge
  name_es: Forja Olvidada
  category: LAIR UPGRADE
  category_es: MEJORA DE GUARIDA
  cost: 50 obols
  cost_es: 50 óbolos
  armour: "—"
  flavor: Ancient fire and ancient steel combined for a singular purpose.
  flavor_es: Fuego antiguo y acero antiguo unidos con un único propósito.
  effect: |
    Weapons and armour purchase costs -20%, rounding down.
  effect_es: |
    El coste de compra de armas y armaduras se reduce un 20 %, redondeando hacia abajo.

- name: Dank Culvert
  name_es: Alcantarilla Húmeda
  category: LAIR UPGRADE
  category_es: MEJORA DE GUARIDA
  cost: 50 obols
  cost_es: 50 óbolos
  armour: "—"
  flavor: Once carrying water in the darkness, now a place accumulating detritus.
  flavor_es: Antaño conducía agua en la oscuridad; ahora es un lugar donde se acumulan desechos.
  effect: |
    Gain +d10 obols at the end of each scenario.
  effect_es: |
    Gana +1D10 óbolos al final de cada escenario.

- name: Abandoned Mine
  name_es: Mina Abandonada
  category: LAIR UPGRADE
  category_es: MEJORA DE GUARIDA
  cost: 50 obols
  cost_es: 50 óbolos
  armour: "—"
