- name: Dark Tunnels
  name_es: Túneles Oscuros
  obols: 50
  category: PURCHASE ONCE
  category_es: COMPRA ÚNICA
  cost: 50 obols
  cost_es: 50 óbolos
  armour: "—"
  flavor: Winding deep below the earth, an ancient network piercing the labyrinth below.
  flavor_es: Una red ancestral serpentea bajo la tierra perforando el laberinto bajo la Ciudad Infinita.
  effect: |
    Each scenario, deploy a single model within 2" of the centre of the board.
  effect_es: |
    Despliega una sola miniatura en un radio de 2" del centro del tablero en cada escenario.

- name: Alchemy Workshop
  name_es: Taller de Alquimia
  obols: 50
  modifiers: { shop: alchemy }
  category: PURCHASE ONCE
  category_es: COMPRA ÚNICA
  cost: 50 obols
  cost_es: 50 óbolos
  armour: "—"
  flavor: Illuminated by phosphorus flasks and cluttered with collections of perilous liquids.
  flavor_es: Iluminado por frascos de fósforo y abarrotado de colecciones de peligrosos líquidos.
  effect: |
    You may choose to buy 1 throwing pot or potion each after battle sequence from the Alchemy Workshop list.
  effect_es: |
    Puedes elegir comprar 1 poción después de la secuencia de después de la batalla en el Taller de Alquimia.

- name: Gloomy Hall
  name_es: Salón Lúgubre
  obols: 50
  modifiers: { bonus_traits: 1 }
  category: PURCHASE ONCE
  category_es: COMPRA ÚNICA
  cost: 50 obols
  cost_es: 50 óbolos
  armour: "—"
  flavor: A great and dimly lit hall, a suitable chamber for minions to perfect their chosen paths.
  flavor_es: Un gran salón pobremente iluminado, una cámara adecuada para que los siervos perfeccionen sus aprendizajes.
  effect: |
    One model in your gathering may take a trait from your covenant or the wretched undead list.
  effect_es: |
    Una miniatura de tu Séquito puede tomar un rasgo de tu pacto o de la lista de los No Muertos Miserables.
