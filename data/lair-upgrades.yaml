  flavor_es: Antes transportaba agua en la oscuridad, ahora es un lugar donde se acumulan los detritos.
  effect: |
    Gain +d10 obols at the end of each scenario.
  effect_es: |
    Gana +d10 óbolos al final de cada escenario.

