- name: Dark Tunnels
  name_es: Túneles Oscuros
  category: LAIR UPGRADE
  category_es: MEJORA DE GUARIDA
  cost: 50 obols
  cost_es: 50 óbolos
  armour: "—"
  flavor: Winding deep below the earth, an ancient network piercing the labyrinth below.
  flavor_es: Serpenteando bajo la tierra, una antigua red que perfora el laberinto inferior.
  effect: |
    Each scenario, deploy a single model within 2" of the centre of the board.
  effect_es: |
    En cada escenario, despliega una única miniatura a 2" o menos del centro del tablero.

- name: Alchemy Workshop
  name_es: Taller de Alquimia
  category: LAIR UPGRADE
  category_es: MEJORA DE GUARIDA
  cost: 50 obols
  cost_es: 50 óbolos
  armour: "—"
  flavor: Illuminated by phosphorus flasks and cluttered with collections of perilous liquids.
  flavor_es: Iluminado por frascos de fósforo y atestado de colecciones de líquidos peligrosos.
  effect: |
    You may choose to buy 1 throwing pot or potion each after battle sequence from the Alchemy Workshop list.
  effect_es: |
    En cada secuencia posterior a la batalla puedes comprar 1 frasco arrojadizo o poción de la lista del Taller de Alquimia.

- name: Gloomy Hall
  name_es: Salón Lúgubre
  category: LAIR UPGRADE
  category_es: MEJORA DE GUARIDA
  cost: 50 obols
  cost_es: 50 óbolos
  armour: "—"
  flavor: A great and dimly lit hall, a suitable chamber for minions to perfect their chosen paths.
  flavor_es: Un gran salón en penumbra, cámara adecuada para que los esbirros perfeccionen el camino elegido.
  effect: |
    One model in your gathering may take a trait from your covenant or the wretched undead list.
  effect_es: |
    Una miniatura de tu Séquito puede tomar un rasgo de tu pacto o de la lista de los No Muertos Miserables.
