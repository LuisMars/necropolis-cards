- name: Bell Tower
  name_es: Campanario
  category: LAIR UPGRADE
  category_es: MEJORA DE GUARIDA
  cost: 50 obols
  cost_es: 50 óbolos
  armour: "—"
  flavor: The peal of this great bell rings forth across the ruins, declaring to all where the power lies.
  flavor_es: El tañido de esta gran campana resuena por las ruinas, proclamando a todos dónde reside el poder.
