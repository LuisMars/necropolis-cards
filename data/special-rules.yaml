# Special Rules — model-tied rules referenced from profile cards.

- category: SPECIAL RULE
  name: Ancient Skill
  restrictions: Lich
  sigil: ''
  effect: 'During this model''s attack action, if any dice rolled is an unmodified 10, that dice is considered a critical hit. Critical hits deal +1 damage.


    Example: a blade (1/3) scoring a glance, a hit, and a critical hit deals 1 + 3 + (3+1) = 8 damage.

    '
- category: SPECIAL RULE
  name: Colossal
  restrictions: Colossal models
  sigil: ''
  effect: 'This model can only take weapons from the Colossal Weapon lists.

    '
- category: SPECIAL RULE
  name: Threatening Aura
  restrictions: Colossal Leader
  sigil: ''
  effect: 'This model may take the Lurk action for 0 AP cost once per turn.

    '
- category: SPECIAL RULE
  name: Fighter
  restrictions: Revenant
  sigil: ''
  effect: 'A Revenant can never gain more than 4 spells (including Summon) and 4 mana points.

    '

# Per-affinity rules — the Companion App labels these as "<Affinity> Leader"
# (Revenant) or "<Affinity> Warrior" (Necromantic Remnant). The default
# Bone/Blood/Plasm effects come from the rulebook's Husk affinity rules;
# Plasm Warrior is the Remnant-specific lighter variant (-1 HP, no
# heavy-armour clause) per the Necromantic Remnant entry.
- category: SPECIAL RULE
  name: Bone Leader
  restrictions: Revenant · Bone
  sigil: ''
  effect: 'If this model chose the Bone keyword, improve its Violence by 1.

    '
- category: SPECIAL RULE
  name: Blood Leader
  restrictions: Revenant · Blood
  sigil: ''
  effect: 'If this model chose the Blood keyword, improve its HP by 2.

    '
- category: SPECIAL RULE
  name: Plasm Leader
  restrictions: Revenant · Plasm
  sigil: ''
  effect: 'If this model chose the Plasm keyword it gains the Fly keyword, -2 HP, and may not wear heavy armour.

    '
- category: SPECIAL RULE
  name: Bone Warrior
  restrictions: Necromantic Remnant · Bone
  sigil: ''
  effect: 'If this model chose the Bone keyword, improve its Violence by 1.

    '
- category: SPECIAL RULE
  name: Blood Warrior
  restrictions: Necromantic Remnant · Blood
  sigil: ''
  effect: 'If this model chose the Blood keyword, improve its HP by 2.

    '
- category: SPECIAL RULE
  name: Plasm Warrior
  restrictions: Necromantic Remnant · Plasm
  sigil: ''
  effect: 'If this model chose the Plasm keyword it gains the Fly keyword and -1 HP.

    '
