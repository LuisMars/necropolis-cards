# Special Rules — model-tied rules referenced from profile cards.

- category: SPECIAL RULE
  category_es: REGLA ESPECIAL
  name: Soul Link
  name_es: Vínculo de Almas
  restrictions: Familiar
  restrictions_es: Familiar
  sigil: ''
  effect: |
    If the familiar moves or is pushed across, or into base contact with, a mana token, the gathering receives an additional mana dice of that type for its mana pool. The token is then removed.
  effect_es: |
    Si el familiar se mueve o es empujado sobre, o hasta contacto base con, un marcador de maná, el Séquito recibe un dado de maná adicional de ese tipo para su reserva de maná. El marcador se retira entonces.

- category: SPECIAL RULE
  category_es: REGLA ESPECIAL
  name: Ancient Skill
  name_es: Habilidad Ancestral
  restrictions: Lich
  restrictions_es: Liche
  sigil: ''
  effect: 'During this model''s attack action, if any dice rolled is an unmodified 10, that dice is considered a critical hit. Critical hits deal +1 damage.


    Example: a blade (1/3) scoring a glance, a hit, and a critical hit deals 1 + 3 + (3+1) = 8 damage.

    '
  effect_es: |
    Durante la acción de ataque de esta miniatura, cualquier dado con resultado de 10 sin modificar se considera un golpe crítico. Los golpes críticos hacen +1 de daño adicional.

    Ejemplo: una espada (1/3) que logra un roce, un acierto y un golpe crítico hace 1 + 3 + (3+1) = 8 de daño.

- category: SPECIAL RULE
  category_es: REGLA ESPECIAL
  name: Colossal
  name_es: Colosal
  restrictions: Colossal models
  restrictions_es: Miniaturas colosales
  sigil: ''
  effect: 'This model can only take weapons from the Colossal Weapon lists.

    '
  effect_es: |
    Esta miniatura solo puede coger armas de las listas de Armas Colosales.

- category: SPECIAL RULE
  category_es: REGLA ESPECIAL
  name: Threatening Aura
  name_es: Aura Amenazante
  restrictions: Colossal Leader
  restrictions_es: Líder Colosal
  sigil: ''
  effect: 'This model may take the Lurk action for 0 AP cost once per turn.

    '
  effect_es: |
    Esta miniatura puede realizar la acción Acechar sin gastar PA una vez por turno.

- category: SPECIAL RULE
  category_es: REGLA ESPECIAL
  name: Fighter
  name_es: Guerrero
  restrictions: Revenant
  restrictions_es: Renacido
  sigil: ''
  effect: 'A Revenant can never gain more than 4 spells (including Summon) and 4 mana points.

    '
  effect_es: |
    Un Renacido nunca puede tener más de 4 hechizos (incluyendo Invocar) y 4 puntos de maná.

# Per-affinity rules — the Companion App labels these as "<Affinity> Leader"
# (Revenant) or "<Affinity> Warrior" (Necromantic Remnant). The default
# Bone/Blood/Plasm effects come from the rulebook's Husk affinity rules;
# Plasm Warrior is the Remnant-specific lighter variant (-1 HP, no
# heavy-armour clause) per the Necromantic Remnant entry.
- category: SPECIAL RULE
  category_es: REGLA ESPECIAL
  name: Bone Leader
  name_es: Líder de Hueso
  restrictions: Revenant · Bone
  restrictions_es: Renacido · Hueso
  sigil: ''
  effect: 'If this model chose the Bone keyword, improve its Violence by 1.

    '
  effect_es: |
    Si esta miniatura eligió la palabra clave Hueso, mejora su Violencia en 1.

- category: SPECIAL RULE
  category_es: REGLA ESPECIAL
  name: Blood Leader
  name_es: Líder de Sangre
  restrictions: Revenant · Blood
  restrictions_es: Renacido · Sangre
  sigil: ''
  effect: 'If this model chose the Blood keyword, improve its HP by 2.

    '
  effect_es: |
    Si esta miniatura eligió la palabra clave Sangre, mejora su HP en 2.

- category: SPECIAL RULE
  category_es: REGLA ESPECIAL
  name: Plasm Leader
  name_es: Líder de Plasma
  restrictions: Revenant · Plasm
  restrictions_es: Renacido · Plasma
  sigil: ''
  effect: 'If this model chose the Plasm keyword it gains the Fly keyword, -2 HP, and may not wear heavy armour.

    '
  effect_es: |
    Si esta miniatura eligió la palabra clave Plasma, gana la palabra clave Vuelo, -2 HP, y no puede llevar armadura pesada.

