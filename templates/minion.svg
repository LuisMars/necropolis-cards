<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="63mm" height="88mm" viewBox="0 0 63 88" data-edit-idx="0">
  <defs data-edit-idx="1">
    <style data-edit-idx="2">
      .parchment    { fill: #ffffff; }
      .banner-title { font-family: 'JSL Blackletter', serif; font-size: 4.681px; fill: #ffffff; text-anchor: middle; }
      .name         { font-family: 'JSL Blackletter', serif; font-size: 6.553px; fill: #000000; text-anchor: middle; }
      .type-line    { font-family: 'Alegreya SC', serif; font-size: 2.715px; fill: #222222; text-anchor: middle; letter-spacing: 0.374px; font-style: italic; }
      .label        { font-family: 'Alegreya SC', serif; font-size: 1.872px; fill: #000000; letter-spacing: 0.281px; font-weight: bold; }
      .value        { font-family: 'Alegreya', serif; font-size: 2.247px; fill: #000000; }
      .stat-val     { font-family: 'Alegreya', serif; font-size: 4.213px; font-weight: bold; fill: #000000; text-anchor: middle; }
      .stat-on-frame{ font-family: 'Alegreya SC', serif; font-size: 1.685px; fill: #1a1a1a; letter-spacing: 0.094px; font-weight: bold; text-anchor: middle; }
      .heading      { font-family: 'Alegreya SC', serif; font-size: 2.247px; fill: #000000; font-weight: bold; letter-spacing: 0.374px; }
      .body         { font-family: 'Alegreya', serif; font-size: 2.34px; fill: #000000; }
      .bodysm       { font-family: 'Alegreya', serif; font-size: 2.621px; fill: #000000; }
      .flavor       { font-family: 'Alegreya', serif; font-size: 2.247px; font-style: italic; fill: #444444; text-anchor: middle; }
      .divider      { fill: none; stroke: #000000; stroke-width: 0.187; }
    </style>
  </defs>

  <rect class="parchment" x="0" y="0" width="63" height="88" data-edit-idx="3"/>

  <!-- SPLOTCHES -->

  <!-- Faded undead-horde watermark -->
  <image xlink:href="file:///home/luismars/necropolis-images/alpha/img-032-056-alpha.png" x="0" y="0" width="63" height="88" preserveAspectRatio="xMidYMid slice" opacity="0.12" data-edit-idx="4"/>

  <!-- Banner -->
  <image xlink:href="file:///home/luismars/necropolis-images/alpha/img-029-048-alpha.png" x="-2.557" y="-2.715" width="67.565" height="18.443" preserveAspectRatio="none" data-edit-idx="5"/>
  <text class="banner-title" x="31.5" y="8.8" style="font-size: 7.489px;" data-edit-idx="6">Minion</text>

  <!-- Stat frame stretched past the trim to match the leader layout.
       Moved up 6 mm from the user-tuned baseline (y=-4.34 → y=-10.34) so
       there's more room below the cells for SPECIAL RULES at a larger font. -->
  <image xlink:href="file:///home/luismars/necropolis-images/alpha/img-032-057-alpha.png" x="-3.387" y="-9.68" width="73.043" height="93.617" preserveAspectRatio="xMidYMid meet" data-edit-idx="7"/>

  <!-- Name + type-keyword line (same Y positions as leader.svg). -->
  <text class="name" x="31.5" y="18.536" data-edit-idx="8">{{NAME}}</text>
  <text class="type-line" x="31.5" y="22.936" data-edit-idx="9">{{TYPE_KEYWORD}} · {{KEYWORD}}</text>

  <!-- Meta row — each column is one centered <text>, anchored at fixed
       fractions of the card width (1/6, 3/6, 5/6 → 10.5, 31.5, 52.5 mm).
       AFFINITY is the player-chosen Bone/Blood/Plasm keyword, populated
       from the Companion App JSON's `profile.affinity`; library cards
       without an affinity render the third cell empty. -->
  <text text-anchor="middle" x="10.5" y="26.213" data-edit-idx="10"><tspan class="label">COST </tspan><tspan class="value">{{COST}}</tspan></text>
  <text text-anchor="middle" x="31.5" y="26.213" data-edit-idx="12"><tspan class="label">BASE </tspan><tspan class="value">{{BASE}}</tspan></text>
  <text text-anchor="middle" x="52.5" y="26.213" data-edit-idx="14"><tspan class="label">AFF </tspan><tspan class="value">{{AFFINITY}}</tspan></text>

  <!-- Stat labels + values shifted up 6 mm with the frame. -->
  <text class="stat-on-frame" x="7.67" y="42.502" style="font-size: 1.872pt;" data-edit-idx="14">AP</text>
  <text class="stat-on-frame" x="17.896" y="42.502" style="font-size: 1.872pt;" data-edit-idx="15">Move</text>
  <text class="stat-on-frame" x="30.614" y="42.502" style="font-size: 1.872pt;" data-edit-idx="16">Violence</text>
  <text class="stat-on-frame" x="44.648" y="42.502" style="font-size: 1.872pt;" data-edit-idx="17">Ranged</text>
  <text class="stat-on-frame" x="55.33" y="42.502" style="font-size: 1.872pt;" data-edit-idx="18">HP</text>

  <text class="stat-val" x="7.597" y="47.557" data-edit-idx="19">{{AP}}</text>
  <text class="stat-val" x="17.896" y="47.464" data-edit-idx="20">{{M}}</text>
  <text class="stat-val" x="30.496" y="47.464" data-edit-idx="21">{{VIOL}}</text>
  <text class="stat-val" x="44.639" y="47.464" data-edit-idx="22">{{RNGD}}</text>
  <text class="stat-val" x="55.358" y="47.464" data-edit-idx="23">{{HP}}</text>

  <line class="divider" x1="4.565" y1="49.5" x2="58.435" y2="49.5" data-edit-idx="24"/>

  <text class="heading" x="4.565" y="52.2" data-edit-idx="25">SPECIAL RULES</text>
  <!-- BODY_BLOCK: SPECIAL_RULES @ x=4.565 y=54.5 lineheight=2.75 width=45chars maxlines=11 style=bodysm -->

  <!-- Flavor at the very bottom -->
  <!-- BODY_BLOCK: FLAVOR @ x=31.5 y=84.6 lineheight=2.153 width=50chars maxlines=2 style=flavor anchor=middle -->
</svg>