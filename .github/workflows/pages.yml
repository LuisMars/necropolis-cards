name: Deploy card printer to GitHub Pages

# Builds web/ (data.json + templates + images + fonts) via bundle.py and
# publishes it as the GitHub Pages site. Images and fonts are vendored
# under assets/ so the build has no external dependencies.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pyyaml

      - name: Bundle data + templates + assets
        run: python3 web/bundle.py

      # Builder rules engine, share-link codec and app-JSON converters
      # (tests/), checked against the data.json just built.
      - name: Run tests
        run: node --test tests/*.test.js

      # Browser tests (tests/ui/): the Builder driven in headless Chromium
      # against the site just bundled.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Run browser tests
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run test:ui

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
